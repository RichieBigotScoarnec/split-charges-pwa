name: Deploy FairSplit to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Lint et tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bloquant sur les erreurs uniquement : les avertissements no-unsanitized
      # sont des faux positifs vérifiés (cf. eslint.config.mjs).
      - name: Lint
        run: npx eslint . --quiet

      - name: Run unit tests
        run: npx vitest run

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # force_orphan : gh-pages est régénérée à chaque déploiement à partir de
      # l'arbre courant. Sans cela (keep_files + destination_dir), la branche
      # accumulait tous les états passés du projet — d'où la récursion test/test/
      # et un index.html de janvier qui a survécu à tous les déploiements.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # Liste sur UNE ligne : un bloc replié insère une espace après chaque
          # saut, et " package.json" ne matche alors plus rien.
          exclude_assets: '.github,node_modules,tests,test-results,.claude,.firebase,docs,package.json,package-lock.json,playwright.config.js,vitest.config.js,firebase.json,.firebaserc,database.rules.json,create-fairsplit-files.ps1,migrate-to-multiuser.html,ARBORESCENCE.txt,CHANGELOG-MULTIUSER.md,CLAUDE.md,CLEAR-CACHE.md,COMMANDES-GIT-RAPIDES.md,DEPLOIEMENT-GITHUB-PAGES.md,GUIDE-MIGRATION-MULTIUSER.md,README-MIGRATION.md,README.md,REGLES-FIREBASE-A-APPLIQUER.txt,SECURITY.md,TROUBLESHOOTING-AUTH.md,WORKFLOW-DEV.md'
          keep_files: false
          enable_jekyll: false
          force_orphan: true

      - name: Display deployment URL
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_NAME="${REPO_NAME#*/}"
          echo "Déployé sur : https://${{ github.repository_owner }}.github.io/${REPO_NAME}/"
