name: Deploy FairSplit to GitHub Pages

on:
  push:
    branches:
      - main
  # Les PR passent lint, tests et E2E, mais ne déploient pas : sans cela une
  # branche n'était validée qu'après fusion, donc trop tard.
  pull_request:
    branches:
      - main

# Lecture seule par défaut : seul le job de déploiement écrit, et il demande
# ce droit pour lui seul. Accordé ici, il s'appliquait aussi aux jobs qui
# exécutent le code des dépendances (npm ci, navigateurs, émulateurs).
permissions:
  contents: read

jobs:
  test:
    name: Lint et tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bloquant sur les erreurs uniquement : les avertissements no-unsanitized
      # sont des faux positifs vérifiés (cf. eslint.config.mjs).
      - name: Lint
        run: npx eslint . --quiet

      # `--quiet` supprime TOUS les avertissements, `no-unsanitized` compris.
      # Mesuré : `eslint .` en rapporte 26, `eslint . --quiet` n'affiche rien.
      # SECURITY.md §4 promet pourtant que le greffon « signale tout nouvel
      # innerHTML dynamique pour relecture » — vrai de la configuration, faux
      # du seul endroit où elle s'exécute toute seule. Un innerHTML non échappé
      # ajouté demain passait au vert.
      #
      # Le plafond fige le nombre de sites existants, tous relus un par un lors
      # de l'audit : ils restent des avertissements, mais un site de plus fait
      # échouer la CI et impose une relecture. Portée à `public/js` seulement —
      # ce qui est livré au navigateur — pour qu'un avertissement de test ne
      # déplace pas le seuil.
      #
      # En abaisser la valeur en même temps qu'on retire un innerHTML fait
      # partie du correctif : un plafond qui ne descend jamais finit par ne
      # plus rien retenir.
      #
      # 22 → 23 le 2026-08-27, pour la modale des dépenses privées
      # (`modules/prive.js`). Le plafond a joué son rôle : il a arrêté la
      # livraison et exigé une justification, plutôt que de laisser un site
      # d'injection s'ajouter en silence. Le déplacer est donc l'usage prévu,
      # pas un contournement — à condition de dire pourquoi.
      #
      # Vérifié avant de le déplacer : les 53 interpolations de ce fichier
      # passent toutes par `escapeHtml` ou `formatCurrency`, à l'exception de
      # chemins de base de données — qui ne touchent jamais le DOM — et d'un
      # nombre déjà échappé au niveau supérieur. La modale suit exactement le
      # patron des autres ; l'avertissement est celui que la règle émet sur
      # toute affectation d'`innerHTML`, faute de pouvoir prouver l'échappement.
      #
      # 23 → 22 le 2026-08-27 : `modules/search.js` écrivait deux lignes de
      # texte pur en `innerHTML`, ce qui obligeait à échapper la requête pour
      # un gain nul. Passées en `textContent`, deux sites disparaissent — le
      # plafond descend avec eux, comme il le doit.
      #
      # 22 → 24 le 2026-08-27, pour l'écran d'import CSV (`modules/import.js`),
      # qui en ouvre deux : la coque de la modale et l'aperçu des lignes.
      # Vérifié interpolation par interpolation avant de le déplacer — le
      # libellé, la catégorie, le payeur, la date et le motif de rejet passent
      # tous par `escapeHtml` ; le reste est soit un nombre, soit un montant
      # déjà formaté par `formatCurrency`. Aucune donnée de fichier n'atteint
      # le DOM sans être échappée, et c'est bien le point : le contenu vient
      # ici d'un fichier que l'utilisateur n'a pas nécessairement écrit.
      #
      # 25 → 26 le 2026-08-28, pour le rapport du mois (`modules/rapport.js`).
      # Deux valeurs y viennent du foyer et d'aucune autre source : le prénom
      # rendu par `memberLabel` et le nom de la catégorie qui a le plus bougé.
      # Les deux passent par `escapeHtml`, et le reste de la modale est soit un
      # montant formaté, soit un nombre, soit un libellé écrit dans le module.
      #
      # 26 → 24 le 2026-09-01, et le compte change de nature : `--max-warnings`
      # donnait un budget COMMUN à `no-unsanitized/*` (24 sites) et `no-console`
      # (2, dans `utils/debug.js`), tous `warn` dans le même bloc de
      # `eslint.config.mjs` et donc indiscernables. Retirer les deux
      # `console.log` aurait libéré en silence deux places pour un `innerHTML`
      # non relu. Ce n'est pas un abaissement du seuil : les 24 sites sont les
      # mêmes qu'avant, seul le bruit d'une autre règle a cessé d'être compté.
      # Le raisonnement est celui qui a déjà restreint le plafond à `public/js`.
      - name: Aucun nouvel innerHTML dynamique
        run: npx eslint public/js --format json | node tools/plafond-innerhtml.mjs

      # Le pipeline publie les regles AVANT le site : bon ordre pour une regle
      # qui elargit, exactement l'inverse de celui qu'il faut pour une regle qui
      # restreint. Ce cas ne se detectait par rien — il vivait dans un
      # commentaire, c'est-a-dire nulle part le jour ou quelqu'un retire un
      # champ sans l'avoir lu. Le controle le rend visible en revue, pas en
      # production.
      - name: Une regle qui restreint ne se publie pas comme les autres
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            reference="FETCH_HEAD"
          else
            git fetch --no-tags --deepen=1 origin "${{ github.ref_name }}"
            reference="HEAD~1"
          fi

          # Le fichier peut manquer sur la reference : premiere introduction des
          # regles, ou historique tronque. Rien n'est alors retire, et le
          # controle doit se taire plutot que d'inventer une restriction.
          git show "$reference:database.rules.json" > "$RUNNER_TEMP/regles-base.json" 2>/dev/null \
            || cp database.rules.json "$RUNNER_TEMP/regles-base.json"

          node tools/regles-restrictives.mjs "$RUNNER_TEMP/regles-base.json" database.rules.json

      - name: Run unit tests
        run: npx vitest run

  e2e:
    name: Tests end-to-end
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Requis par les émulateurs Firebase : firebase-tools refuse un JDK < 21.
      # C'est ce qui empêche de les exécuter sur certains postes de développement.
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # L'émulateur Database est un jar téléchargé par la CLI au premier
      # démarrage, hors de `node_modules` — le cache npm de `setup-node` ne le
      # voit donc pas, et il repartait du réseau à chaque exécution.
      # firebase-tools le signalait lui-même dans les journaux du job.
      #
      # La clé suit `package-lock.json` : la version des émulateurs est celle
      # que réclame la CLI, donc monter firebase-tools doit invalider le cache
      # plutôt que rejouer un jar périmé. Le repli `restore-keys` sert ce
      # jour-là — la CLI complète ce qui manque, et l'entrée suivante est
      # enregistrée sous la nouvelle clé.
      - name: Cache des émulateurs Firebase
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: emulateurs-firebase-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            emulateurs-firebase-${{ runner.os }}-

      # emulators:exec démarre auth + database, exécute la suite, puis arrête
      # tout. Les émulateurs chargent database.rules.json : firebase-integration
      # valide donc les règles de sécurité réelles, et non un mock.
      #
      # `--project=chromium` écarte les contrôles qui s'adressent au VRAI
      # Firebase : ils tournent plus loin, APRÈS la publication des règles.
      # Cf. le job `e2e-reel` et le commentaire de `playwright.config.js`.
      - name: Run E2E tests
        run: npx firebase emulators:exec --only auth,database --project fairsplit-foyer "npx playwright test --project=chromium --reporter=line"

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Le déploiement de GitHub Pages ne publie que `public/`. Les règles de
  # sécurité, elles, vivent dans Firebase et n'y montent que par une commande
  # lancée à la main — étape invisible depuis le dépôt, donc oubliée. Une base
  # tourne alors sous des règles plus anciennes que le code qui l'interroge,
  # sans que rien ne le signale : le dépôt affiche la protection, la base ne
  # l'applique pas.
  deploy-rules:
    needs: [test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` n'est PAS lancé dans ce job.
      #
      # Il exécute les scripts d'installation de 973 dépendances, et ce job
      # détient le compte de service Firebase — rôle « Realtime Database
      # Admin », qui ignore les règles et lit comme écrit tout. Un script
      # `postinstall` hostile dans n'importe quelle dépendance transitive
      # n'aurait qu'à lire l'environnement, ou attendre le fichier.
      #
      # SECURITY.md pose déjà ce raisonnement pour un autre secret : « Ne pas
      # remonter ce droit au niveau du workflow : il s'appliquerait aussi aux
      # jobs qui exécutent le code des dépendances. » Il valait pour le plus
      # puissant des deux.
      #
      # `firebase-tools` est donc installé seul, épinglé, sans toucher au
      # `package.json` du dépôt.
      - name: Installer firebase-tools, et lui seul
        run: npm install --no-save --ignore-scripts firebase-tools@15.11.0

      # Déploiement systématique, sans condition sur la modification du
      # fichier. Une condition mal posée ne casse rien de visible : elle saute
      # le déploiement en silence, ce qui est exactement la panne qu'on cherche
      # à supprimer. Déployer des règles identiques est sans effet.
      - name: Déployer les règles de base de données
        env:
          # Compte de service Firebase, en JSON. À créer dans la console Google
          # Cloud (rôle « Firebase Realtime Database Admin ») puis à déposer en
          # secret du dépôt sous ce nom.
          COMPTE_DE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          if [ -z "${COMPTE_DE_SERVICE:-}" ]; then
            echo "::warning title=Règles non déployées::Le secret FIREBASE_SERVICE_ACCOUNT est absent. Les règles de database.rules.json ne sont PAS appliquées à Firebase — lancez « npm run deploy:rules » à la main, ou créez le secret."
            {
              echo "### ⚠️ Règles de sécurité non déployées"
              echo ""
              echo "Le secret \`FIREBASE_SERVICE_ACCOUNT\` est absent du dépôt."
              echo "La base tourne donc sous les règles déployées précédemment, qui"
              echo "peuvent être plus anciennes que \`database.rules.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Le secret transite par une variable puis un fichier hors du dépôt :
          # jamais par la ligne de commande, que les journaux conservent.
          fichier="$RUNNER_TEMP/compte-de-service.json"
          printf '%s' "$COMPTE_DE_SERVICE" > "$fichier"
          export GOOGLE_APPLICATION_CREDENTIALS="$fichier"

          npx firebase deploy --only database --project fairsplit-foyer --non-interactive

          rm -f "$fichier"
          echo "### ✅ Règles de sécurité déployées" >> "$GITHUB_STEP_SUMMARY"

  # Les 17 contrôles qui s'adressent au VRAI Firebase.
  #
  # Ils viennent APRÈS `deploy-rules`, et l'ordre n'est pas un détail : ils
  # s'exécutent contre les règles PUBLIÉES. Les faire garder le déploiement —
  # ce qu'ils faisaient jusqu'au 2026-09-01, logés dans le job `e2e` — crée un
  # cycle dont on ne sort pas : une règle corrigée ne peut pas être publiée
  # tant qu'ils ne passent pas, et ils ne peuvent pas passer sans elle. Le
  # correctif du bac à sable a ainsi bloqué sa propre publication, et avec
  # elle celle du site, `deploy` portant la même dépendance.
  #
  # Ils ne gardent donc rien : ils constatent, et `alerte-publication` ouvre un
  # ticket s'ils tombent. C'est le bon rôle pour un contrôle qui dépend d'un
  # service tiers et de l'état d'un compte partagé.
  #
  # Bornés à `push` : ils vident le nœud `sandbox` avant chaque scénario, et
  # deux exécutions simultanées se marcheraient dessus. Les fusions sur `main`
  # sont sérialisées ; deux PR ouvertes le même jour ne le seraient pas.
  #
  # Sans le secret, les 17 se sautent et le job passe au vert sans rien prouver.
  e2e-reel:
    name: Tests contre le vrai Firebase
    needs: deploy-rules
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Pas d'émulateur ici : ces contrôles parlent au vrai service, c'est leur
      # raison d'être. Le serveur statique est démarré par `webServer` dans
      # `playwright.config.js`.
      - name: Run E2E tests against real Firebase
        env:
          FAIRSPLIT_TEST_PASSWORD: ${{ secrets.FAIRSPLIT_TEST_PASSWORD }}
        run: npx playwright test --project=reel --reporter=line

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-reel
          path: test-results/
          retention-days: 7

  # `deploy-rules` figure dans les dépendances, et ce n'est pas décoratif.
  #
  # Les deux publications ne portaient que sur `[test, e2e]` : elles partaient
  # donc EN PARALLÈLE, sans qu'aucun ordre ne soit garanti entre le moment où le
  # site change et celui où les règles changent. En pratique la publication des
  # pages est la plus lente, ce qui masquait le problème — mais « en pratique »
  # n'est pas une garantie, et c'est précisément le genre de dérive silencieuse
  # que le job `deploy-rules` avait été créé pour supprimer.
  #
  # L'ordre correct est RÈGLES D'ABORD, pour la même raison qu'une migration de
  # schéma précède le code qui s'en sert : une règle qui ÉLARGIT — un champ
  # accepté en plus, une permission ajoutée — ne gêne aucun client déjà en
  # ligne, alors qu'un client publié avant sa règle voit ses écritures refusées.
  #
  # Constaté sur `aval/{qui}/publieLeTotal` : `$autre/.validate` valant `false`,
  # le champ est rejeté tant que les règles sont anciennes, et c'est l'écriture
  # ENTIÈRE du partage qui échoue — l'écran annonce « Partage non enregistré »
  # sans que rien n'indique pourquoi.
  #
  # Le cas inverse — une règle qui RESTREINT — demande l'ordre opposé, et il ne
  # se détecte plus à l'œil : `tools/regles-restrictives.mjs` arrête la revue et
  # exige de publier en deux temps, ou d'acquitter le retrait en disant pourquoi.
  #
  # CONSÉQUENCE À CONNAÎTRE : depuis que cette dépendance existe, un échec du
  # déploiement des règles GÈLE aussi la mise en ligne du site. C'est délibéré —
  # mieux vaut ne pas publier un client que publier un client dont les règles ne
  # sont pas là — mais une panne côté Firebase suffit alors à bloquer une
  # livraison qui n'y touchait pas. Le filet est `alerte-publication` : il ouvre
  # un ticket, qui ne disparaît pas d'un rafraîchissement de page.
  #
  # Sans le secret Firebase, `deploy-rules` sort en succès avec un
  # avertissement : cette dépendance ne peut donc pas bloquer la publication du
  # site sur un dépôt qui n'a pas le secret.
  deploy:
    needs: [test, e2e, deploy-rules]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # Le seul job qui pousse : la branche gh-pages.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Le service worker sert un cache nommé d'après cette valeur. La dériver
      # du commit garantit qu'un déploiement invalide toujours l'ancien cache.
      - name: Stamp service worker cache version
        run: |
          sed -i "s/__CACHE_VERSION__/${GITHUB_SHA::12}/" public/sw.js

          # `grep -n` affichait la ligne sans jamais échouer. Si le marqueur
          # disparaissait — une refonte de sw.js, une faute de frappe — la
          # substitution ne faisait rien, le job restait vert, et le cache
          # n'était plus jamais invalidé. Le contrôle de publication, lui,
          # rejoue le même sed sur sa propre copie : les deux côtés seraient
          # identiquement non substitués, et la comparaison passerait aussi.
          grep -q "CACHE_VERSION = '${GITHUB_SHA::12}'" public/sw.js || {
            echo "::error title=Service worker non estampillé::Le marqueur __CACHE_VERSION__ est absent de public/sw.js"
            exit 1
          }

      # publish_dir: public — seul ce dossier est publié. Auparavant la racine
      # entière l'était, filtrée par une liste d'exclusion de 26 entrées : tout
      # fichier ajouté à la racine était publié par défaut, sauf oubli près.
      # Cette denylist a laissé fuiter package.json, vitest.config.mjs, tools/ et
      # eslint.config.mjs. Un dossier dédié inverse la logique : publier devient
      # un acte délibéré.
      #
      # force_orphan : gh-pages est régénérée à chaque déploiement. Sans cela
      # (keep_files + destination_dir), la branche accumulait tous les états
      # passés du projet — d'où la récursion test/test/ et un index.html de
      # janvier qui a survécu à tous les déploiements.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          keep_files: false
          enable_jekyll: false
          force_orphan: true

      - name: Display deployment URL
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_NAME="${REPO_NAME#*/}"
          echo "Déployé sur : https://${{ github.repository_owner }}.github.io/${REPO_NAME}/"

  # Le site peut ne pas être à jour sans que rien ne le dise.
  #
  # Constaté le 25 août 2026 : la #83 fusionnée, le job « Tests end-to-end » est
  # tombé sur main, `deploy` en dépend et n'a donc jamais tourné. GitHub Pages a
  # continué à servir la version précédente pendant deux heures, personne n'en a
  # rien su, et le raccourci qu'on croyait livré n'existait pas.
  #
  # Deux angles morts, deux jobs. Celui-ci répond au premier : ce qui est publié
  # est-il bien ce qui a été fusionné ? Il compare la branche gh-pages au
  # contenu de `public/`, `sw.js` estampillé compris. Une divergence — un
  # fichier manquant, une publication partielle, une branche écrite par autre
  # chose — fait échouer le workflow au lieu de passer inaperçue.
  verifier-publication:
    name: Vérifier ce qui est réellement publié
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Le même estampillage que le job de publication : sans lui, `sw.js`
      # différerait toujours, et le contrôle crierait à chaque déploiement
      # jusqu'à ce qu'on cesse de le lire.
      - name: Stamp service worker cache version
        run: sed -i "s/__CACHE_VERSION__/${GITHUB_SHA::12}/" public/sw.js

      - name: Comparer gh-pages au contenu de public/
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin gh-pages

          # `git archive` plutôt qu'un worktree : celui-ci dépose un fichier
          # `.git` dans le dossier, que `public/` n'a pas. La comparaison aurait
          # donc échoué à chaque déploiement, sur une différence qui n'en est
          # pas une — et un contrôle qui crie toujours cesse d'être lu.
          # Éprouvé contre la vraie branche avant d'être écrit ici.
          rm -rf /tmp/publie
          mkdir -p /tmp/publie
          git archive FETCH_HEAD | tar -x -C /tmp/publie

          # `.nojekyll` est posé par l'action de publication, il n'existe pas
          # dans le dépôt. C'est la seule différence attendue.
          rm -f /tmp/publie/.nojekyll

          if diff --recursive --brief public /tmp/publie; then
            echo "### ✅ Publication conforme" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### ❌ Ce qui est publié ne correspond pas à ce qui a été fusionné"
            echo ""
            echo "La branche \`gh-pages\` diffère de \`public/\` au commit \`${GITHUB_SHA::12}\`."
            echo "Le site sert donc autre chose que le dépôt."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Le second angle mort, et le plus coûteux : un workflow rouge sur main que
  # personne ne regarde. Un échec ici ouvre un ticket, qui lui ne disparaît pas
  # d'un rafraîchissement de page.
  #
  # `needs` porte sur toute la chaîne : un échec à n'importe quelle étape —
  # y compris avant `deploy`, qui est justement le cas survenu — déclenche
  # l'alerte. `if: failure()` seul ne suffirait pas, un job sans dépendances
  # n'ayant rien à observer.
  alerte-publication:
    name: Signaler une publication en échec
    needs: [test, e2e, deploy-rules, deploy, verifier-publication, e2e-reel]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest

    # Accordé à ce seul job. Le workflow reste en lecture seule par défaut :
    # les jobs qui exécutent le code des dépendances n'ont rien à écrire.
    permissions:
      issues: write

    steps:
      - name: Ouvrir ou compléter le ticket
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT: ${{ github.repository }}
          EXECUTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          ETIQUETTE="alerte-deploiement"
          TITRE="⚠️ Déploiement en échec sur main"
          CORPS="Le workflow de déploiement a échoué sur \`main\` (commit \`${GITHUB_SHA::12}\`).

          **Le site n'a donc pas été mis à jour** : GitHub Pages sert toujours la version précédente.

          Exécution : $EXECUTION"

          # Un ticket par panne, pas un par exécution : deux fusions coup sur
          # coup en ouvriraient deux pour la même cause.
          # Le ticket est retrouvé par LABEL, et parmi ceux que le workflow a
          # lui-même ouverts. La recherche portait sur le titre seul : le dépôt
          # étant public, n'importe qui pouvait ouvrir un ticket portant ce
          # titre et détourner vers lui toutes les alertes de panne, avec leurs
          # liens d'exécution.
          gh label create "$ETIQUETTE" --repo "$DEPOT" --color B60205 \
            --description "Ouvert automatiquement par la CI" 2>/dev/null || true

          EXISTANT=$(gh issue list --repo "$DEPOT" --state open \
            --label "$ETIQUETTE" --author app/github-actions \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTANT" ]; then
            gh issue comment "$EXISTANT" --repo "$DEPOT" --body "$CORPS"
            echo "Ticket #$EXISTANT complété."
          else
            gh issue create --repo "$DEPOT" --title "$TITRE" --body "$CORPS" --label "$ETIQUETTE"
          fi
