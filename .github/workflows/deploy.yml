name: Deploy FairSplit to GitHub Pages

on:
  push:
    branches:
      - main
  # Les PR passent lint, tests et E2E, mais ne déploient pas : sans cela une
  # branche n'était validée qu'après fusion, donc trop tard.
  pull_request:
    branches:
      - main

# Lecture seule par défaut : seul le job de déploiement écrit, et il demande
# ce droit pour lui seul. Accordé ici, il s'appliquait aussi aux jobs qui
# exécutent le code des dépendances (npm ci, navigateurs, émulateurs).
permissions:
  contents: read

jobs:
  test:
    name: Lint et tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bloquant sur les erreurs uniquement : les avertissements no-unsanitized
      # sont des faux positifs vérifiés (cf. eslint.config.mjs).
      - name: Lint
        run: npx eslint . --quiet

      - name: Run unit tests
        run: npx vitest run

  e2e:
    name: Tests end-to-end
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Requis par les émulateurs Firebase : firebase-tools refuse un JDK < 21.
      # C'est ce qui empêche de les exécuter sur certains postes de développement.
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # emulators:exec démarre auth + database, exécute la suite, puis arrête
      # tout. Les émulateurs chargent database.rules.json : firebase-integration
      # valide donc les règles de sécurité réelles, et non un mock.
      - name: Run E2E tests
        run: npx firebase emulators:exec --only auth,database --project fairsplit-foyer "npx playwright test --reporter=line"

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Le déploiement de GitHub Pages ne publie que `public/`. Les règles de
  # sécurité, elles, vivent dans Firebase et n'y montent que par une commande
  # lancée à la main — étape invisible depuis le dépôt, donc oubliée. Une base
  # tourne alors sous des règles plus anciennes que le code qui l'interroge,
  # sans que rien ne le signale : le dépôt affiche la protection, la base ne
  # l'applique pas.
  deploy-rules:
    needs: [test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Déploiement systématique, sans condition sur la modification du
      # fichier. Une condition mal posée ne casse rien de visible : elle saute
      # le déploiement en silence, ce qui est exactement la panne qu'on cherche
      # à supprimer. Déployer des règles identiques est sans effet.
      - name: Déployer les règles de base de données
        env:
          # Compte de service Firebase, en JSON. À créer dans la console Google
          # Cloud (rôle « Firebase Realtime Database Admin ») puis à déposer en
          # secret du dépôt sous ce nom.
          COMPTE_DE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          if [ -z "${COMPTE_DE_SERVICE:-}" ]; then
            echo "::warning title=Règles non déployées::Le secret FIREBASE_SERVICE_ACCOUNT est absent. Les règles de database.rules.json ne sont PAS appliquées à Firebase — lancez « npm run deploy:rules » à la main, ou créez le secret."
            {
              echo "### ⚠️ Règles de sécurité non déployées"
              echo ""
              echo "Le secret \`FIREBASE_SERVICE_ACCOUNT\` est absent du dépôt."
              echo "La base tourne donc sous les règles déployées précédemment, qui"
              echo "peuvent être plus anciennes que \`database.rules.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Le secret transite par une variable puis un fichier hors du dépôt :
          # jamais par la ligne de commande, que les journaux conservent.
          fichier="$RUNNER_TEMP/compte-de-service.json"
          printf '%s' "$COMPTE_DE_SERVICE" > "$fichier"
          export GOOGLE_APPLICATION_CREDENTIALS="$fichier"

          npx firebase deploy --only database --project fairsplit-foyer --non-interactive

          rm -f "$fichier"
          echo "### ✅ Règles de sécurité déployées" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # Le seul job qui pousse : la branche gh-pages.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Le service worker sert un cache nommé d'après cette valeur. La dériver
      # du commit garantit qu'un déploiement invalide toujours l'ancien cache.
      - name: Stamp service worker cache version
        run: |
          sed -i "s/__CACHE_VERSION__/${GITHUB_SHA::12}/" public/sw.js
          grep -n "CACHE_VERSION =" public/sw.js

      # publish_dir: public — seul ce dossier est publié. Auparavant la racine
      # entière l'était, filtrée par une liste d'exclusion de 26 entrées : tout
      # fichier ajouté à la racine était publié par défaut, sauf oubli près.
      # Cette denylist a laissé fuiter package.json, vitest.config.js, tools/ et
      # eslint.config.mjs. Un dossier dédié inverse la logique : publier devient
      # un acte délibéré.
      #
      # force_orphan : gh-pages est régénérée à chaque déploiement. Sans cela
      # (keep_files + destination_dir), la branche accumulait tous les états
      # passés du projet — d'où la récursion test/test/ et un index.html de
      # janvier qui a survécu à tous les déploiements.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          keep_files: false
          enable_jekyll: false
          force_orphan: true

      - name: Display deployment URL
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_NAME="${REPO_NAME#*/}"
          echo "Déployé sur : https://${{ github.repository_owner }}.github.io/${REPO_NAME}/"
