name: Sauvegarde chiffrée de la base

# Le foyer n'a qu'un exemplaire de son historique : une base Realtime Database,
# sans sauvegarde automatique sur le forfait gratuit. La sauvegarde existante
# dans l'application est entièrement manuelle — il faut y penser, et on n'y
# pense qu'après.
#
# Ce workflow l'automatise. Il ne remplace pas l'export manuel : il garantit
# qu'une copie existe même les mois où personne n'y a songé.
on:
  schedule:
    # 03:17 UTC chaque jour. Un horaire décalé du haut de l'heure : les runners
    # y sont moins encombrés, et un retard de plusieurs minutes est sans effet
    # sur une sauvegarde quotidienne.
    - cron: '17 3 * * *'
  # Déclenchement à la demande, depuis l'onglet Actions — utilisable depuis un
  # téléphone, avant une manipulation risquée par exemple.
  workflow_dispatch:

# Lecture seule : ce workflow ne pousse rien dans le dépôt.
permissions:
  contents: read

jobs:
  sauvegarder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` n'est PAS lancé : ce workflow détient le compte de service
      # Firebase et la phrase secrète, et n'a besoin que de `firebase-tools`.
      # Exécuter les scripts d'installation de 973 dépendances à côté de ces
      # deux secrets était une surface gratuite. `enveloppe-sauvegarde.mjs`
      # n'a aucune dépendance.
      - name: Installer firebase-tools, et lui seul
        run: npm install --no-save --ignore-scripts firebase-tools@15.11.0

      # Contrairement au déploiement des règles, l'absence de secret échoue ici.
      # Un déploiement manqué se rattrape à la fusion suivante ; une sauvegarde
      # manquée ne se rattrape pas — et une sauvegarde qu'on croit faite est
      # pire que pas de sauvegarde du tout.
      - name: Vérifier les secrets
        env:
          COMPTE_DE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PHRASE_SECRETE: ${{ secrets.SAUVEGARDE_PASSPHRASE }}
        run: |
          set -euo pipefail

          # `[ test ] && affectation` rendrait 1 quand le test est faux, donc
          # quand le secret est présent : sous `set -e`, l'étape échouerait
          # précisément dans le cas nominal.
          manquants=""
          if [ -z "${COMPTE_DE_SERVICE:-}" ]; then
            manquants="$manquants FIREBASE_SERVICE_ACCOUNT"
          fi
          if [ -z "${PHRASE_SECRETE:-}" ]; then
            manquants="$manquants SAUVEGARDE_PASSPHRASE"
          fi

          if [ -n "$manquants" ]; then
            echo "::error title=Sauvegarde impossible::Secret(s) absent(s) :$manquants"
            {
              echo "### ❌ Sauvegarde non effectuée"
              echo ""
              echo "Secret(s) absent(s) :$manquants"
              echo ""
              echo "Sans eux, aucune copie de l'historique du foyer n'est conservée."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Le secret transite par une variable puis un fichier hors du dépôt,
      # jamais par la ligne de commande que les journaux conservent.
      - name: Extraire la base
        env:
          COMPTE_DE_SERVICE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          fichier="$RUNNER_TEMP/compte-de-service.json"
          printf '%s' "$COMPTE_DE_SERVICE" > "$fichier"
          export GOOGLE_APPLICATION_CREDENTIALS="$fichier"

          # `household` seul : le bac à sable ne contient que des données
          # d'essai, qu'il serait trompeur de conserver aux côtés des vraies.
          npx firebase database:get /household \
            --project fairsplit-foyer \
            -o "$RUNNER_TEMP/vidage.json"

          rm -f "$fichier"

      # L'application refuse un fichier qui ne porte pas son enveloppe : sans
      # cette étape, la sauvegarde ne serait restaurable qu'en ligne de
      # commande, donc pas depuis un téléphone. Le script refuse aussi un
      # vidage vide, qui s'archiverait aussi bien qu'un autre.
      - name: Envelopper au format FairSplit
        run: node tools/enveloppe-sauvegarde.mjs "$RUNNER_TEMP/vidage.json" "$RUNNER_TEMP/sauvegarde.json"

      # Le contenu part chiffré, et le restera.
      #
      # Le dépôt est privé depuis le 2026-08-27, donc ses artefacts ne sont plus
      # téléchargeables que par qui a accès au dépôt. Le chiffrement n'en devient
      # pas facultatif pour autant : une archive de toutes les finances du foyer
      # ne doit pas reposer sur un seul réglage de visibilité, qui se change d'un
      # clic et s'est déjà trouvé dans l'autre position.
      #
      # La phrase secrète passe par un fichier, jamais par la ligne de commande.
      - name: Chiffrer
        env:
          PHRASE_SECRETE: ${{ secrets.SAUVEGARDE_PASSPHRASE }}
        run: |
          set -euo pipefail

          phrase="$RUNNER_TEMP/phrase"
          printf '%s' "$PHRASE_SECRETE" > "$phrase"

          # Les paramètres de dérivation sont écrits, pas hérités.
          #
          # Sans eux, l'archive prenait les défauts de l'image du runner. Ils
          # sont bons aujourd'hui — vérifié en rejouant la commande : S2K mode
          # 3, SHA-512, 65 011 712 itérations — mais rien ne les tient, et une
          # mise à jour d'image les changerait sans que rien ne le dise.
          #
          # Ce n'est pas un détail ici : le dépôt est public, donc l'artefact
          # est téléchargeable par tout titulaire d'un compte GitHub, et 90
          # jours de clichés quotidiens s'attaquent hors ligne, sans limite de
          # tentatives. Toute la confidentialité de l'historique du foyer tient
          # à l'entropie de SAUVEGARDE_PASSPHRASE et au coût de sa dérivation.
          gpg --batch --yes --symmetric \
            --cipher-algo AES256 \
            --s2k-mode 3 \
            --s2k-digest-algo SHA512 \
            --s2k-count 65011712 \
            --passphrase-file "$phrase" \
            --output "$RUNNER_TEMP/sauvegarde.json.gpg" \
            "$RUNNER_TEMP/sauvegarde.json"

          rm -f "$phrase" "$RUNNER_TEMP/sauvegarde.json" "$RUNNER_TEMP/vidage.json"

          echo "HORODATAGE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Déposer l'archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sauvegarde-${{ env.HORODATAGE }}
          path: ${{ runner.temp }}/sauvegarde.json.gpg
          # 90 jours, le maximum côté GitHub. Au-delà, seule une copie
          # téléchargée à la main subsiste.
          retention-days: 90
          if-no-files-found: error

      - name: Résumé
        run: |
          {
            echo "### ✅ Sauvegarde déposée"
            echo ""
            echo "Archive : \`sauvegarde-$HORODATAGE.json.gpg\`, conservée 90 jours."
            echo ""
            echo "Pour la restaurer : télécharger l'artefact, le déchiffrer avec"
            echo "\`gpg --decrypt sauvegarde.json.gpg > sauvegarde.json\`, puis"
            echo "passer par « Restaurer depuis un fichier » dans l'application."
          } >> "$GITHUB_STEP_SUMMARY"

  # Une sauvegarde qui échoue ne se voit nulle part : ce workflow tourne à
  # 03:17 sans que personne ne regarde, et son propre commentaire dit qu'une
  # sauvegarde qu'on croit faite est pire que pas de sauvegarde du tout. Il
  # n'avait pourtant aucun moyen de le dire — l'onglet Actions n'est pas un
  # endroit qu'on visite le matin.
  alerte-sauvegarde:
    name: Signaler une sauvegarde en échec
    needs: sauvegarder
    if: failure()
    runs-on: ubuntu-latest

    # Accordé à ce seul job : le reste du workflow n'écrit rien dans le dépôt.
    permissions:
      issues: write

    steps:
      - name: Ouvrir ou compléter le ticket
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT: ${{ github.repository }}
          EXECUTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          ETIQUETTE="alerte-sauvegarde"
          TITRE="⚠️ Sauvegarde quotidienne en échec"
          CORPS="La sauvegarde chiffrée de l'historique du foyer a échoué.

          **Aucune copie n'a été déposée** : l'historique n'existe qu'en base.

          Exécution : $EXECUTION"

          # Un ticket par panne, pas un par nuit : sans cela, une cause qui dure
          # en ouvrirait un chaque matin.
          # Le ticket est retrouvé par LABEL, et parmi ceux que le workflow a
          # lui-même ouverts. La recherche portait sur le titre seul : le dépôt
          # étant public, n'importe qui pouvait ouvrir un ticket portant ce
          # titre et détourner vers lui toutes les alertes de panne, avec leurs
          # liens d'exécution.
          gh label create "$ETIQUETTE" --repo "$DEPOT" --color B60205 \
            --description "Ouvert automatiquement par la CI" 2>/dev/null || true

          EXISTANT=$(gh issue list --repo "$DEPOT" --state open \
            --label "$ETIQUETTE" --author app/github-actions \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTANT" ]; then
            gh issue comment "$EXISTANT" --repo "$DEPOT" --body "$CORPS"
            echo "Ticket #$EXISTANT complété."
          else
            gh issue create --repo "$DEPOT" --title "$TITRE" --body "$CORPS" --label "$ETIQUETTE"
          fi
